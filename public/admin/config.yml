# Taranity content admin (Sveltia CMS).
# Editing here commits to this repo on `main`, which triggers the Cloudflare Pages
# build and republishes the site. Sign in with a fine-grained GitHub token (repo
# contents: read/write) via "Sign In Using Access Token", or with GitHub once an
# OAuth relay is added later.
backend:
  name: github
  repo: voyagi/taranity.com
  branch: main

# Uploaded images are written here and served from the site root.
media_folder: public/uploads
public_folder: /uploads

# Pin how saved files are written so a CMS save never reformats a data file
# (the repo's JSON is 2-space indented; a formatting drift would make noisy
# commits and could confuse the build-time guards' error line numbers).
output:
  json:
    indent_style: space
    indent_size: 2

# The `pattern` rules below enforce the brand's hard no-em-dash rule in the
# editor itself (friendly error at save) instead of a failed deploy minutes
# later. The regex is written with the \u2014 escape on purpose: the em dash
# character itself must never appear in this repo's files.
collections:
  - name: journal
    label: Journal
    label_singular: Journal post
    description: Long-form articles. The filename becomes the URL slug. Saved changes go live in about 2 minutes.
    folder: src/content/journal
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [order, pubDate, title]
    fields:
      - { name: title, label: Title, widget: string, pattern: &no_em_dash ['^[^\u2014]*$', 'No em dashes. Use a comma, colon, or full stop.'] }
      - { name: description, label: Meta description, widget: text, hint: 'Aim for 150-160 characters.', maxlength: 170, pattern: *no_em_dash }
      - { name: lead, label: Lead (standfirst), widget: text, required: false, pattern: *no_em_dash }
      - { name: kicker, label: Kicker, widget: string, default: Journal, pattern: *no_em_dash }
      - { name: pubDate, label: Publish date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { name: updatedDate, label: Updated date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { name: keywords, label: Keywords, widget: list, required: false }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - name: faqs
        label: FAQs
        widget: list
        required: false
        summary: '{{fields.q}}'
        fields:
          - { name: q, label: Question, widget: string, pattern: *no_em_dash }
          - { name: a, label: Answer, widget: text, pattern: *no_em_dash }
      - { name: order, label: Listing order, widget: number, default: 99, value_type: int }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site settings
        file: src/data/site.json
        description: Global text used across every design. Saved changes go live in about 2 minutes.
        fields:
          - { name: tagline, label: Tagline, widget: string, hint: 'Used in page titles and social cards.', pattern: *no_em_dash }
          - { name: description, label: Studio description, widget: text, hint: 'No em dashes; do not lead with AI.', pattern: *no_em_dash }
          - { name: contactEmail, label: Contact email, widget: string, type: email }
          - name: socials
            label: Social links
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Label, widget: string, pattern: *no_em_dash }
              - { name: href, label: URL, widget: string, type: url }

  - name: pages
    label: Pages
    files:
      - name: vitrine
        label: Home page (Vitrine)
        file: src/data/vitrine.json
        description: >-
          Editorial copy for the flagship home page. Text only: the layout,
          motion, and craft artwork stay in code. No em dashes; do not lead
          with AI. Saved changes go live in about 2 minutes.
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: kicker, label: Kicker, widget: string, hint: 'Small line above the headline.', pattern: *no_em_dash }
              - { name: titleLines, label: Headline lines, widget: list, hint: 'One entry per line of the big headline. The last line is shown lighter.', pattern: *no_em_dash }
              - { name: sub, label: Sub-heading, widget: text, pattern: *no_em_dash }
          - name: manifesto
            label: The point
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, hint: 'e.g. 01 · The point' }
              - { name: statementLines, label: Statement lines, widget: list, hint: 'One entry per line. Each rises in on scroll.', pattern: *no_em_dash }
              - { name: copy, label: Paragraph, widget: text, pattern: *no_em_dash }
              - name: method
                label: Method steps
                widget: list
                summary: '{{fields.name}}'
                fields:
                  - { name: index, label: Number, widget: string, hint: 'e.g. 01' }
                  - { name: name, label: Name, widget: string, pattern: *no_em_dash }
                  - { name: line, label: Description, widget: text, pattern: *no_em_dash }
          - name: crafts
            label: What we make
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, hint: 'e.g. 02 · What we make' }
              - { name: note, label: Section note, widget: string }
              - name: items
                label: Crafts
                widget: object
                # Fixed set of six: each craft's artwork and order live in code.
                # Edit the words only.
                fields:
                  - name: websites
                    label: Websites
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: kicker, label: Kicker, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: includes, label: Includes, widget: list, pattern: *no_em_dash }
                  - name: commerce
                    label: Commerce
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: kicker, label: Kicker, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: includes, label: Includes, widget: list, pattern: *no_em_dash }
                  - name: applications
                    label: Applications
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: kicker, label: Kicker, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: includes, label: Includes, widget: list, pattern: *no_em_dash }
                  - name: automation
                    label: Automation
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: kicker, label: Kicker, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: includes, label: Includes, widget: list, pattern: *no_em_dash }
                  - name: advisory
                    label: Advisory
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: kicker, label: Kicker, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: includes, label: Includes, widget: list, pattern: *no_em_dash }
                  - name: intelligentSystems
                    label: Intelligent systems
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: kicker, label: Kicker, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: includes, label: Includes, widget: list, pattern: *no_em_dash }
          - name: studio
            label: The studio
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, hint: 'e.g. 03 · The studio' }
              - { name: lede, label: Lede, widget: string, pattern: *no_em_dash }
              - { name: story, label: Story paragraphs, widget: list, hint: 'One entry per paragraph.', pattern: *no_em_dash }
              - name: principles
                label: Principles
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                  - { name: body, label: Body, widget: text, pattern: *no_em_dash }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, hint: 'e.g. 04 · Contact' }
              - { name: titleLines, label: Headline lines, widget: list, hint: 'One entry per line.', pattern: *no_em_dash }
              - { name: lead, label: Lead paragraph, widget: text, pattern: *no_em_dash }
              - { name: location, label: Location line, widget: string, pattern: *no_em_dash }

      - name: prism
        label: Prism page
        file: src/data/prism.json
        description: >-
          Copy for the Prism design. Text only: the colour field, marquee,
          badge, and layout stay in code. No em dashes; do not lead with AI.
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: label, label: Label, widget: string, hint: 'Small line above the poster headline.', pattern: *no_em_dash }
              - { name: titleLines, label: Headline lines, widget: list, hint: 'One entry per stacked poster line.', pattern: *no_em_dash }
              - { name: captions, label: Captions, widget: list, hint: 'The two small scattered caption blocks.', pattern: *no_em_dash }
              - { name: link, label: Hero link text, widget: string, hint: 'The italic in-page link to Services.', pattern: *no_em_dash }
          - name: services
            label: Services
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, pattern: *no_em_dash }
              - name: items
                label: Services
                widget: object
                # Fixed set of five: the order and numbering live in code.
                # Edit the words only.
                fields:
                  - name: websites
                    label: 01 Websites
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: honor, label: We honor, widget: text, pattern: *no_em_dash }
                  - name: commerce
                    label: 02 Commerce
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: honor, label: We honor, widget: text, pattern: *no_em_dash }
                  - name: apps
                    label: 03 Apps
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: honor, label: We honor, widget: text, pattern: *no_em_dash }
                  - name: automation
                    label: 04 Automation
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: honor, label: We honor, widget: text, pattern: *no_em_dash }
                  - name: systems
                    label: 05 Systems
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, pattern: *no_em_dash }
                      - { name: line, label: Description, widget: text, pattern: *no_em_dash }
                      - { name: honor, label: We honor, widget: text, pattern: *no_em_dash }
          - name: approach
            label: Approach
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, pattern: *no_em_dash }
              - { name: lines, label: Manifesto lines, widget: list, hint: 'One entry per line.', pattern: *no_em_dash }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, pattern: *no_em_dash }
              - { name: title, label: Headline, widget: string, pattern: *no_em_dash }
              - { name: lead, label: Lead paragraph, widget: text, pattern: *no_em_dash }
