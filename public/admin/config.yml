# Taranity content admin (Sveltia CMS).
# Editing here commits to this repo on `main`, which triggers the Cloudflare Pages
# build and republishes the site. Sign in with a fine-grained GitHub token (repo
# contents: read/write) via "Sign In Using Access Token", or with GitHub once an
# OAuth relay is added later.
backend:
  name: github
  repo: voyagi/taranity.com
  branch: main

# Uploaded images are written here and served from the site root.
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: journal
    label: Journal
    label_singular: Journal post
    description: Long-form articles. The filename becomes the URL slug.
    folder: src/content/journal
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: '{{title}}'
    sortable_fields: [order, pubDate, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Meta description, widget: text, hint: 'Aim for 150-160 characters.' }
      - { name: lead, label: Lead (standfirst), widget: text, required: false }
      - { name: kicker, label: Kicker, widget: string, default: Journal }
      - { name: pubDate, label: Publish date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { name: updatedDate, label: Updated date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { name: keywords, label: Keywords, widget: list, required: false }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - name: faqs
        label: FAQs
        widget: list
        required: false
        summary: '{{fields.q}}'
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - { name: order, label: Listing order, widget: number, default: 99, value_type: int }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site settings
        file: src/data/site.json
        description: Global text used across every design.
        fields:
          - { name: tagline, label: Tagline, widget: string, hint: 'Used in page titles and social cards.' }
          - { name: description, label: Studio description, widget: text, hint: 'No em dashes; do not lead with AI.' }
          - { name: contactEmail, label: Contact email, widget: string }
          - name: socials
            label: Social links
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: URL, widget: string }

  - name: pages
    label: Pages
    files:
      - name: vitrine
        label: Home page (Vitrine)
        file: src/data/vitrine.json
        description: >-
          Editorial copy for the flagship home page. Text only: the layout,
          motion, and craft artwork stay in code. No em dashes; do not lead with AI.
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: kicker, label: Kicker, widget: string, hint: 'Small line above the headline.' }
              - { name: titleLines, label: Headline lines, widget: list, hint: 'One entry per line of the big headline. The last line is shown lighter.' }
              - { name: sub, label: Sub-heading, widget: text }
          - name: manifesto
            label: The point
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, hint: 'e.g. 01 · The point' }
              - { name: statementLines, label: Statement lines, widget: list, hint: 'One entry per line. Each rises in on scroll.' }
              - { name: copy, label: Paragraph, widget: text }
              - name: method
                label: Method steps
                widget: list
                summary: '{{fields.name}}'
                fields:
                  - { name: index, label: Number, widget: string, hint: 'e.g. 01' }
                  - { name: name, label: Name, widget: string }
                  - { name: line, label: Description, widget: text }
          - name: crafts
            label: What we make
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, hint: 'e.g. 02 · What we make' }
              - { name: note, label: Section note, widget: string }
              - name: items
                label: Crafts
                widget: object
                # Fixed set of six: each craft's artwork and order live in code.
                # Edit the words only.
                fields:
                  - name: websites
                    label: Websites
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: kicker, label: Kicker, widget: string }
                      - { name: line, label: Description, widget: text }
                      - { name: includes, label: Includes, widget: list }
                  - name: commerce
                    label: Commerce
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: kicker, label: Kicker, widget: string }
                      - { name: line, label: Description, widget: text }
                      - { name: includes, label: Includes, widget: list }
                  - name: applications
                    label: Applications
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: kicker, label: Kicker, widget: string }
                      - { name: line, label: Description, widget: text }
                      - { name: includes, label: Includes, widget: list }
                  - name: automation
                    label: Automation
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: kicker, label: Kicker, widget: string }
                      - { name: line, label: Description, widget: text }
                      - { name: includes, label: Includes, widget: list }
                  - name: advisory
                    label: Advisory
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: kicker, label: Kicker, widget: string }
                      - { name: line, label: Description, widget: text }
                      - { name: includes, label: Includes, widget: list }
                  - name: intelligentSystems
                    label: Intelligent systems
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: kicker, label: Kicker, widget: string }
                      - { name: line, label: Description, widget: text }
                      - { name: includes, label: Includes, widget: list }
          - name: studio
            label: The studio
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, hint: 'e.g. 03 · The studio' }
              - { name: lede, label: Lede, widget: string }
              - { name: story, label: Story paragraphs, widget: list, hint: 'One entry per paragraph.' }
              - name: principles
                label: Principles
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Body, widget: text }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: label, label: Section label, widget: string, hint: 'e.g. 04 · Contact' }
              - { name: titleLines, label: Headline lines, widget: list, hint: 'One entry per line.' }
              - { name: lead, label: Lead paragraph, widget: text }
              - { name: location, label: Location line, widget: string }
